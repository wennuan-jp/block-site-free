<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>ZenBlock | Site Access Restricted</title>
        <style>
            :root {
                --bg-color: #08090c;
                --text-color: #ffffff;
                --text-muted: rgba(255, 255, 255, 0.5);
                --accent-color: #3b82f6;
                --accent-glow: rgba(59, 130, 246, 0.4);
                --danger-color: #ef4444;
                --danger-glow: rgba(239, 68, 68, 0.4);
                --success-color: #10b981;
                --border-color: rgba(255, 255, 255, 0.1);
                --font-main: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            }

            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: var(--bg-color);
                color: var(--text-color);
                font-family: var(--font-main);
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
                overflow: hidden;
                text-align: center;
                position: relative;
            }

            /* Ambient background glow */
            .ambient-glow {
                position: absolute;
                width: 400px;
                height: 400px;
                background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
                opacity: 0.15;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                pointer-events: none;
                transition: background 0.6s ease;
            }

            body.forbidden-mode .ambient-glow {
                background: radial-gradient(circle, var(--danger-glow) 0%, transparent 70%);
                opacity: 0.2;
            }

            .container {
                max-width: 600px;
                padding: 2.5rem;
                animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1);
                z-index: 1;
            }

            .line {
                width: 44px;
                height: 2px;
                background-color: var(--accent-color);
                margin: 0 auto 2rem;
                box-shadow: 0 0 15px var(--accent-glow);
                transition: all 0.4s ease;
            }

            body.forbidden-mode .line {
                background-color: var(--danger-color);
                box-shadow: 0 0 18px var(--danger-glow);
            }

            h1 {
                font-size: 3.2rem;
                font-weight: 200;
                letter-spacing: -0.04em;
                margin-bottom: 0.75rem;
                background: linear-gradient(180deg, #ffffff 0%, rgba(255, 255, 255, 0.45) 100%);
                -webkit-background-clip: text;
                -webkit-text-fill-color: transparent;
            }

            .tagline {
                font-size: 1rem;
                color: var(--text-muted);
                margin-bottom: 1.75rem;
                font-weight: 300;
                text-transform: uppercase;
                letter-spacing: 0.2em;
            }

            .blocked-url {
                font-size: 0.88rem;
                color: rgba(255, 255, 255, 0.75);
                margin-bottom: 2.2rem;
                font-weight: 400;
                word-break: break-all;
                max-width: 520px;
                margin-left: auto;
                margin-right: auto;
                padding: 0.6rem 1.2rem;
                background: rgba(255, 255, 255, 0.04);
                border-radius: 8px;
                border: 1px solid var(--border-color);
                font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            }

            .badge {
                display: inline-block;
                padding: 0.25rem 0.75rem;
                border-radius: 9999px;
                font-size: 0.75rem;
                font-weight: 600;
                letter-spacing: 0.05em;
                text-transform: uppercase;
                margin-bottom: 1rem;
            }

            .badge-blocked {
                background: rgba(59, 130, 246, 0.15);
                color: #60a5fa;
                border: 1px solid rgba(59, 130, 246, 0.3);
            }

            .badge-forbidden {
                background: rgba(239, 68, 68, 0.15);
                color: #f87171;
                border: 1px solid rgba(239, 68, 68, 0.3);
            }

            .actions {
                display: flex;
                gap: 1rem;
                justify-content: center;
                align-items: center;
                margin-top: 1rem;
            }

            .button {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.5rem;
                padding: 0.75rem 1.75rem;
                border: 1px solid var(--border-color);
                background: rgba(255, 255, 255, 0.03);
                color: #ffffff;
                text-decoration: none;
                border-radius: 6px;
                font-size: 0.9rem;
                font-weight: 400;
                letter-spacing: 0.05em;
                transition: all 0.25s ease;
                cursor: pointer;
            }

            .button:hover {
                background: rgba(255, 255, 255, 0.9);
                color: #000000;
                transform: translateY(-1px);
            }

            .button-primary {
                border-color: rgba(59, 130, 246, 0.4);
                background: rgba(59, 130, 246, 0.15);
                color: #93c5fd;
            }

            .button-primary:hover {
                background: #3b82f6;
                color: #ffffff;
                border-color: #3b82f6;
                box-shadow: 0 4px 14px rgba(59, 130, 246, 0.4);
            }

            /* Modal Overlay */
            .modal-overlay {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                background: rgba(0, 0, 0, 0.75);
                backdrop-filter: blur(8px);
                -webkit-backdrop-filter: blur(8px);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
                opacity: 0;
                pointer-events: none;
                transition: opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .modal-overlay.active {
                opacity: 1;
                pointer-events: auto;
            }

            .modal-card {
                background: #111318;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 14px;
                width: 90%;
                max-width: 480px;
                padding: 2rem;
                text-align: left;
                box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
                transform: scale(0.95) translateY(10px);
                transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            }

            .modal-overlay.active .modal-card {
                transform: scale(1) translateY(0);
            }

            .modal-header h3 {
                font-size: 1.25rem;
                font-weight: 500;
                color: #ffffff;
                margin-bottom: 0.35rem;
            }

            .modal-header p {
                font-size: 0.85rem;
                color: var(--text-muted);
                line-height: 1.4;
                margin-bottom: 1.25rem;
            }

            .input-wrapper {
                margin-bottom: 1rem;
            }

            .input-label {
                display: block;
                font-size: 0.8rem;
                font-weight: 500;
                color: rgba(255, 255, 255, 0.7);
                margin-bottom: 0.4rem;
                text-transform: uppercase;
                letter-spacing: 0.05em;
            }

            textarea#intentionInput {
                width: 100%;
                height: 90px;
                background: rgba(0, 0, 0, 0.4);
                border: 1px solid rgba(255, 255, 255, 0.15);
                border-radius: 8px;
                color: #ffffff;
                font-family: inherit;
                font-size: 0.95rem;
                padding: 0.75rem;
                resize: none;
                transition: border-color 0.2s ease, box-shadow 0.2s ease;
            }

            textarea#intentionInput:focus {
                outline: none;
                border-color: var(--accent-color);
                box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.2);
            }

            .feedback-box {
                display: none;
                padding: 0.75rem 1rem;
                border-radius: 8px;
                font-size: 0.85rem;
                margin-bottom: 1rem;
                line-height: 1.4;
                animation: fadeIn 0.3s ease;
            }

            .feedback-loading {
                background: rgba(59, 130, 246, 0.1);
                border: 1px solid rgba(59, 130, 246, 0.25);
                color: #93c5fd;
                display: flex;
                align-items: center;
                gap: 0.6rem;
            }

            .feedback-denied {
                background: rgba(239, 68, 68, 0.1);
                border: 1px solid rgba(239, 68, 68, 0.3);
                color: #fca5a5;
            }

            .feedback-approved {
                background: rgba(16, 185, 129, 0.12);
                border: 1px solid rgba(16, 185, 129, 0.3);
                color: #6ee7b7;
            }

            .feedback-error {
                background: rgba(245, 158, 11, 0.1);
                border: 1px solid rgba(245, 158, 11, 0.3);
                color: #fcd34d;
            }

            .spinner {
                width: 16px;
                height: 16px;
                border: 2px solid rgba(59, 130, 246, 0.3);
                border-top-color: #3b82f6;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
            }

            .modal-actions {
                display: flex;
                justify-content: flex-end;
                gap: 0.75rem;
                margin-top: 1.25rem;
            }

            .modal-actions button {
                padding: 0.6rem 1.25rem;
                border-radius: 6px;
                font-size: 0.88rem;
                cursor: pointer;
                transition: all 0.2s ease;
            }

            .btn-secondary {
                background: transparent;
                border: 1px solid rgba(255, 255, 255, 0.15);
                color: rgba(255, 255, 255, 0.8);
            }

            .btn-secondary:hover {
                background: rgba(255, 255, 255, 0.05);
                color: #ffffff;
            }

            .btn-primary {
                background: #3b82f6;
                border: 1px solid #3b82f6;
                color: #ffffff;
                font-weight: 500;
            }

            .btn-primary:hover:not(:disabled) {
                filter: brightness(1.1);
                box-shadow: 0 2px 10px rgba(59, 130, 246, 0.4);
            }

            .btn-primary:disabled {
                opacity: 0.5;
                cursor: not-allowed;
            }

            @keyframes spin {
                to { transform: rotate(360deg); }
            }

            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(12px); }
                to { opacity: 1; transform: translateY(0); }
            }
        </style>
    </head>
    <body>
        <div class="ambient-glow"></div>
        <div class="container">
            <div class="line" id="accentLine"></div>
            <div id="statusBadge" class="badge badge-blocked">Blocked &middot; AI Evaluation</div>
            <h1 id="mainTitle">Site is Blocked</h1>
            <p id="mainTagline" class="tagline">Stay Focused &middot; Regain Control</p>
            <div class="blocked-url" id="blockedUrl">Resolving URL...</div>
            <div class="actions">
                <button class="button" id="goBackBtn">
                    &larr; Go Back
                </button>
                <button class="button button-primary" id="bypassBtn">
                    <span>⚡ Request 5 Min Access</span>
                </button>
            </div>
        </div>

        <!-- AI Evaluation Modal Dialog -->
        <div class="modal-overlay" id="intentionModal">
            <div class="modal-card">
                <div class="modal-header">
                    <h3>State Your Intention</h3>
                    <p>Our local AI evaluator (LM Studio) will judge whether your intention is legitimate and productive for work/study before granting 5 minutes of access.</p>
                </div>
                <div class="input-wrapper">
                    <label class="input-label" for="intentionInput">What is your reason for visiting?</label>
                    <textarea id="intentionInput" placeholder="e.g., Looking up documentation on Rust async/await for my project..." autofocus></textarea>
                </div>
                <div id="feedbackBox" class="feedback-box"></div>
                <div class="modal-actions">
                    <button class="btn-secondary" id="modalCancelBtn">Cancel</button>
                    <button class="btn-primary" id="modalSubmitBtn">Submit to AI</button>
                </div>
            </div>
        </div>

        <script src="blocked.js"></script>
    </body>
</html>
